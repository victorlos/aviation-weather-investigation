version: 2
sources:
  - name: bts
    database: AVIATION_WEATHER_PROJECT
    schema: RAW_DATA
    tables:
      - name: raw_flights
      - name: raw_airport_coordinates
      - name: raw_carrier_lookup

  - name: noaa_weather
    database: AVIATION_WEATHER_PROJECT
    schema: RAW_DATA
    tables:
      - name: raw_stations
      - name: raw_weather
        description: "This table contains the raw weather information for the weather in the US."
        loaded_at_field: "to_timestamp(to_varchar(date), 'YYYYMMDD')"
        freshness:
          warn_after: {count: 4, period: day}
          error_after: {count: 7, period: day}