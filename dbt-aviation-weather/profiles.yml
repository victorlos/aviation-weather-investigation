# profiles.yml
aviation_weather:
  target: ci
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: ACCOUNTADMIN
      warehouse: AVIATION_WEATHER_WAREHOUSE
      database: AVIATION_WEATHER_PROJECT
      schema: DEV

    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: GITHUB_ACTIONS_ROLE
      warehouse: AVIATION_WEATHER_WAREHOUSE
      database: AVIATION_WEATHER_PROJECT
      schema: CI
